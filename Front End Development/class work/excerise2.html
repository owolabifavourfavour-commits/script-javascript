<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Contact Form</title>

  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: blue; background-repeat: no-repeat; background-position: center; height: 100vh; display: flex; 
justify-content: center; align-items: center; padding: 2px 30px; margin: 0;">

<!-- form -->
 <form class="form">
        
    <div class="group">

      <form style="width:420px;height:650px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);border-radius:15px;display:flex;flex-direction:column;
        color:white;"></form>
        <header style="text-align:center;font-size:25px;margin-top:30px;margin-bottom:40px;font-weight:bold;">Client Contact Form</header>


        <div style="display:flex; flex-direction:column; margin-left:35px; margin-right:35px; margin-bottom:30px;">
             <label style="font-size: 20px; font-weight: bold; margin-bottom: 10px; color: white;">Name</label>
        <input type="text" style="height: 40px; border: none; border-bottom: 1px solid white; background: none;outline: none; color: transparent; font-size: 18px;" 
        placeholder="Enter your name" style="color: white; opacity: 8;">
        </div>
        
        <div style="display: flex; flex-direction: column; margin-left: 35px; margin-right: 35px; margin-bottom: 25px;">
            <label style="font-size: 20px; font-weight: bold; margin-bottom: 10px; color: white;">Email</label>
            <input type="email" style="height: 40px; border: none; border-bottom: 1px solid white; background: none; outline: none; color: white; font-size: 18px;" 
            placeholder="Enter your email" style="color:  white; opacity: 8;">
        </div>

        <div style="display:flex; flex-direction:column; margin-left:35px; margin-right:35px; margin-bottom:25px;">
            <label style="font-size:20px; font-weight:bold; margin-bottom:10px; color:white;">Phone Number</label>
            <input type="tel" style="height:40px; border:none; border-bottom:1px solid white; background:none; outline:none; color:white; font-size:18px;" 
            placeholder="Enter your phone number" style="color: white; opacity: 8;">
        </div>

        <div style="display:flex; flex-direction:column; margin-left:35px; margin-right:35px; margin-bottom:25px;">
            <label style="font-size:20px; font-weight:bold; margin-bottom:10px; color:white;">Address</label>
            <input type="address" style="height:40px; border:none; border-bottom:1px solid white; background:none; outline:none; color:white; font-size:18px;" 
            placeholder="Enter your address" style="color: white; opacity: 8;">
        </div>
        
        <div style="display:flex; flex-direction:column; margin-left:35px; margin-right:35px; margin-bottom:25px;">
            <label style="font-size:20px; font-weight:bold; margin-bottom:10px; color:white;">Message</label>
            <input type="message" style="height:40px; border:none; border-bottom:1px solid white; background:none; outline:none; color:white; font-size:18px;" 
            placeholder="Type your message" style="color: white; opacity: 8;">
        </div>

        <button type="submit" style="width:330px; height:55px; margin:auto; background:royalblue; border:none; border-radius:30px; color:white; font-size:22px; 
        cursor:pointer;">Send Message</button>
    </div>
    

 </form>
   


</body>
</html>
